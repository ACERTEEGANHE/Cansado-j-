name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          if [ -f source.zip ]; then
            echo "Descompactando source.zip..."
            unzip -o source.zip
            if [ -d worldxadrez-app ]; then
              cp -r worldxadrez-app/* .
              rm -rf worldxadrez-app
            fi
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Build client
        env:
          VITE_GAME_SERVER_URL: ${{ secrets.VITE_GAME_SERVER_URL || 'https://worldxadrez-server-hl21.onrender.com' }}
        run: npm run build
        working-directory: client

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worldxadrez-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
