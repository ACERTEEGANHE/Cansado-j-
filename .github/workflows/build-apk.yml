name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldxadrez-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WorldXadrez APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Baixar o repositório
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js compatível com Vite 6 e Capacitor 7
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir versões
        run: |
          node --version
          npm --version

      # 3. Configurar Java para o Gradle Android
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Conferir Java
        run: java -version

      # 4. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      # 5. Preparar o projeto, caso esteja dentro de source.zip
      - name: Preparar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          if [ -f source.zip ]; then
            echo "Encontrado source.zip. Extraindo projeto..."
            mkdir -p extracted
            unzip -o source.zip -d extracted

            if [ -f extracted/netcheck/package.json ]; then
              PROJECT_DIR="extracted/netcheck"
            elif [ -f extracted/worldxadrez-app/package.json ]; then
              PROJECT_DIR="extracted/worldxadrez-app"
            elif [ -f extracted/package.json ]; then
              PROJECT_DIR="extracted"
            else
              echo "ERRO: não encontrei o package.json do projeto."
              find extracted -maxdepth 5 -name package.json -print
              exit 1
            fi

            echo "Projeto encontrado em: $PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f package.json ]; then
            echo "ERRO: package.json não encontrado na raiz."
            ls -la
            exit 1
          fi

          if [ ! -f client/package.json ]; then
            echo "ERRO: client/package.json não encontrado."
            find . -maxdepth 4 -name package.json -print
            exit 1
          fi

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERRO: configuração do Capacitor não encontrada."
            exit 1
          fi

          echo "Estrutura do projeto validada."
          echo "package.json da raiz:"
          cat package.json

          echo "package.json do cliente:"
          cat client/package.json

      # 6. Instalar dependências da raiz
      - name: Instalar dependências da raiz
        run: npm install --no-audit --no-fund

      # 7. Instalar dependências do cliente
      - name: Instalar dependências do cliente
        working-directory: client
        run: npm install --no-audit --no-fund

      # 8. Compilar o Vite
      - name: Compilar cliente
        working-directory: client
        env:
          VITE_GAME_SERVER_URL: ${{ secrets.VITE_GAME_SERVER_URL || 'https://worldxadrez-server-hl21.onrender.com' }}
        run: |
          set -e
          npm run build

          if [ ! -d dist ]; then
            echo "ERRO: a compilação não criou client/dist."
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            echo "ERRO: dist/index.html não foi gerado."
            exit 1
          fi

          echo "Compilação do cliente concluída."
          ls -lah dist

      # 9. Verificar a configuração do Capacitor
      - name: Verificar Capacitor
        run: |
          set -e

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const c = p.dependencies || {};
            const d = p.devDependencies || {};

            if (!c['@capacitor/core'] || !c['@capacitor/android']) {
              console.error('ERRO: dependências do Capacitor ausentes na raiz.');
              process.exit(1);
            }

            if (!c['@capacitor/core'].startsWith('^7.') ||
                !c['@capacitor/android'].startsWith('^7.')) {
              console.error('AVISO: confirme se as versões do Capacitor são compatíveis.');
            }

            if (!d['@capacitor/cli']) {
              console.error('ERRO: @capacitor/cli ausente nas devDependencies.');
              process.exit(1);
            }

            console.log('Dependências do Capacitor verificadas.');
          "

          npx cap --version
          npx cap doctor

      # 10. Criar o projeto Android se ainda não existir
      - name: Preparar Android
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Pasta android ausente. Criando projeto Android..."
            npx cap add android
          else
            echo "Projeto Android existente."
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERRO: android/gradlew não encontrado."
            find android -maxdepth 3 -type f | head -100
            exit 1
          fi

      # 11. Sincronizar os arquivos e plugins
      - name: Sincronizar Capacitor
        run: |
          set -e
          npx cap sync android

      # 12. Conferir ambiente Android
      - name: Conferir ambiente de compilação
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --version
          ./gradlew tasks --no-daemon

      # 13. Gerar APK de depuração
      - name: Gerar APK Debug
        working-directory: android
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon

      # 14. Validar APK
      - name: Conferir APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: o arquivo APK está vazio."
            exit 1
          fi

          echo "APK criado com sucesso:"
          ls -lh "$APK"
          sha256sum "$APK"

      # 15. Disponibilizar o APK para download
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: worldxadrez-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 16. Guardar os logs se alguma etapa falhar
      - name: Salvar logs de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldxadrez-build-logs
          path: |
            android/**/*.log
            android/**/build/reports/**
            client/npm-debug.log
            npm-debug.log
          if-no-files-found: ignore
          retention-days: 7
