name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descompactar o projeto
        shell: bash
        run: |
          set -euo pipefail

          if [ -f source.zip ]; then
            echo "Descompactando source.zip..."
            unzip -o source.zip

            if [ -d worldxadrez-app ]; then
              cp -a worldxadrez-app/. .
              rm -rf worldxadrez-app
            fi
          fi

          test -f package.json || {
            echo "ERRO: package.json não encontrado na raiz."
            exit 1
          }

          test -f client/package.json || {
            echo "ERRO: client/package.json não encontrado."
            exit 1
          }

          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build client
        working-directory: client
        env:
          VITE_GAME_SERVER_URL: ${{ secrets.VITE_GAME_SERVER_URL || 'https://worldxadrez-server-hl21.onrender.com' }}
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worldxadrez-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
